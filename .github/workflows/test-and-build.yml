name: Test and Build

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Node version comes from package.json engines.node, the same field Vercel builds with.
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Scoped to the new variant code. Full-repo `pnpm run lint` has ~450
      # pre-existing errors (Node globals in /scripts not covered by eslint.config.js);
      # that cleanup is out of scope for this PR and tracked separately.
      - name: Lint variant code
        run: pnpm run lint:modern

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Node version comes from package.json engines.node, the same field Vercel builds with.
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run test

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Node version comes from package.json engines.node, the same field Vercel builds with.
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build (includes verify-z-classes)
        run: pnpm run build

  e2e:
    name: E2E tests
    needs: [unit, build]
    runs-on: ubuntu-latest
    # Suite was already ~19.5 min (workers=1); each gated post adds 16 tests.
    # 2026-11-24: 46-page expansion pushed it past 30m (batch 2 died at 30m14s).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Node version comes from package.json engines.node, the same field Vercel builds with.
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium
      # Behavior/e2e on localhost. The prod-targeted affiliate-tracking suite and the
      # visual specs are excluded via testIgnore in playwright.config.js.
      # 2026-11-26: content-quality ran every gated post on every PR (batch-01 E2E took
      # 30m17s). Scope it to the posts this PR ADDS; when none are added, run a fixed
      # 10-slug regression sample. Local runs without CONTENT_SLUGS still use the full list.
      - name: Scope content E2E to posts added in this PR
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}
          SLUGS=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }} HEAD -- 'src/newblog/data/posts/*.json' | xargs -r -n1 basename | sed 's/\.json$//' | paste -sd, -)
          if [ -z "$SLUGS" ]; then
            SLUGS=how-to-prevent-a-hangover,best-liver-supplements,best-hangover-recovery-drinks,best-liver-detox-supplements,best-fatty-liver-supplements,tylenol-and-alcohol,pedialyte-vs-gatorade-hangover,pepto-bismol-and-alcohol,zbiotics-vs-cheers,nac-vs-dhm-which-antioxidant-better-liver-protection-2025
          fi
          echo "CONTENT_SLUGS=$SLUGS" >> "$GITHUB_ENV"
          echo "Content E2E slugs: $SLUGS"
      - name: E2E tests
        run: pnpm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual baselines (bootstrap)
    needs: e2e
    runs-on: ubuntu-latest
    # Informational, never blocks merge: this job GENERATES Linux-native baselines
    # (macOS-committed baselines differ from Linux CI font rendering) and uploads them
    # as an artifact. continue-on-error keeps occasional element-stability flakes on
    # slow runners from blocking PRs. To promote to a strict gate once the design is
    # locked: commit the Linux baselines, switch test:visual:update -> test:visual,
    # and drop continue-on-error.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Node version comes from package.json engines.node, the same field Vercel builds with.
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate Linux visual baselines
        run: pnpm run test:visual:update
      - name: Upload Linux baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: tests/visual/**/*.png
          retention-days: 14

  mass-edit-check:
    name: Bulk-edit guard (>20 modified existing posts)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Node version comes from package.json engines.node, the same field Vercel builds with.
          node-version-file: package.json
          # No pnpm in this job; stop setup-node auto-enabling a pnpm cache from packageManager.
          package-manager-cache: false
      - name: Self-test the guard
        run: node --test scripts/check-mass-edit.test.mjs scripts/lib/get-date-modified.test.mjs
      - name: Count modified existing posts (added posts exempt)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-mass-edit.mjs --base origin/${{ github.base_ref }}
